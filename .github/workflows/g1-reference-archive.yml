name: G1 approved reference archive verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'g1/source/approved-reference-webp.json'
      - 'scripts/materialize-g1.mjs'
      - 'docs/g1-reference-jobs.json'
      - '.github/workflows/g1-reference-archive.yml'
  pull_request:
    paths:
      - 'g1/source/approved-reference-webp.json'
      - 'scripts/materialize-g1.mjs'
      - 'docs/g1-reference-jobs.json'
      - '.github/workflows/g1-reference-archive.yml'

permissions:
  contents: read

jobs:
  verify-four-approved-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize 4 individually-approved WebP photos
        run: node scripts/materialize-g1.mjs
      - name: Verify the reconstructed assets byte-for-byte
        run: node scripts/materialize-g1.mjs --verify
      - name: Ensure 4 archived legacy images, 7 approved references, 1 unapproved shot
        run: |
          node scripts/materialize-g1.mjs --verify > /tmp/g1-check.json
          node -e "const r=require('/tmp/g1-check.json'), m=require('./docs/g1-reference-jobs.json'); if(r.approved!==4||r.assets.length!==4||m.productionStatus.approvedReferenceCount!==7||m.productionStatus.approvedWebpArchivedInGitHub!==4||m.jobs.filter(j=>j.status==='not-accepted').length!==1||!m.jobs.find(j=>j.id==='nagyeong-face').userApprovedFace||!m.jobs.find(j=>j.id==='nagyeong-full').userApprovedFull||m.jobs.find(j=>j.id==='nagyeong-full').approvedOriginalSHA256!=='760c034efd9d8a0371c3114c19dd243403d362cbaf29df3276bd97a4d9ec5eb7'||!m.jobs.find(j=>j.id==='seoa-full').userApprovedFull||m.jobs.find(j=>j.id==='seoa-full').approvedOriginalSHA256!=='5025bc844119c7434d4cd7da491b3281328527df5defada7475dc39fe28febaa'||m.jobs.find(j=>j.id==='seoa-face').approvedOriginalSHA256!=='59f9a31b49dedd318611ac3707e80027910f8f1e410c163965d0ea2db8d80c5b')process.exit(1)"
