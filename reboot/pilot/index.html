<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#090e14">
 <meta name="description" content="라스트 시그널 — 사진 위에서 등장인물과 대화하고 운명을 선택하는 시네마틱 범죄 스릴러.">
 <title>라스트 시그널 · 죽은 사람의 전화</title>
 <link rel="stylesheet" href="./style.css">
 <script src="./episode.js" defer></script>
 <script src="./actors.js" defer></script>
 <script src="./app.js" defer></script>
</head>
<body>
<main id="game" class="cinema" tabindex="-1" aria-label="라스트시그널 시네마틱 게임">
 <div id="hero" class="scene-stage" data-setting="newsroom">
  <div id="heroPhoto" class="scene-photo" aria-hidden="true"></div>
  <div class="scene-atmosphere" aria-hidden="true"></div>
  <div class="stage-vignette" aria-hidden="true"></div>
 </div>
 <header class="game-head">
  <div class="head-left">
   <span class="brand-mark">◎</span>
   <div class="head-title"><strong>LAST SIGNAL</strong><small id="stepLabel">EPISODE 00 · 02:17</small></div>
  </div>
  <div class="head-actions">
   <button type="button" id="fullScreen" class="glass-icon" aria-label="전체 화면으로 보기" title="전체 화면">⛶</button>
   <button type="button" id="caseOpen" class="glass-icon" aria-haspopup="dialog" aria-controls="casePanel" aria-expanded="false" aria-label="사건 파일 열기" title="사건 파일">☷ <span id="evidenceCounter" class="count">0</span></button>
  </div>
  <div id="progress" class="head-progress" role="progressbar" aria-label="에피소드 진행" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><span id="progressFill"></span></div>
 </header>
 <section class="scene-meta" aria-label="장면 정보">
   <span id="place">서울 · 방송국 탐사보도국</span>
   <span class="scene-clock" id="clock">02:17</span>
 </section>

 <section class="narrative" id="narrative" aria-label="현재 장면">
  <div class="narrative-top">
   <span id="speakerName" class="speaker-name">장면 설명</span>
   <span id="portraitTrust" class="trust-label" hidden></span>
  </div>
  <h1 id="sceneTitle">죽은 사람의 전화</h1>
  <div id="sceneCopy" class="dialogue-copy" aria-live="polite"></div>
  <p id="consequence" class="consequence" hidden></p>
  <div id="beatIndicators" class="beat-indicators" aria-label="장면 대사 진행"></div>

  <div class="action-footer">
   <button id="talkOpen" type="button" class="talk-trigger" hidden>인물과 대화하기 <span aria-hidden="true">↗</span></button>
   <button id="beatNext" type="button" class="next-beat">다음 <span aria-hidden="true">›</span></button>
  </div>

  <section id="choiceZone" class="choice-zone" aria-label="선택지" hidden>
   <div class="choice-heading"><span id="decisionLabel">어떻게 행동하시겠습니까?</span><span id="choiceCount"></span></div>
   <div id="choices" class="choices"></div>
  </section>
  <section id="endingNote" class="ending-note" hidden></section>
 </section>
 <p id="stillLabel" class="media-hint">이미지 원본 여부 확인 중</p>
</main>

<div id="casePanel" class="scrim" role="dialog" aria-modal="true" aria-labelledby="caseTitle" hidden>
 <div class="drawer">
  <div class="drawer-head"><div><small>PERSONAL CASE FILE</small><h2 id="caseTitle">나의 사건 기록</h2></div><button id="caseClose" type="button" aria-label="닫기">✕</button></div>
  <p class="drawer-summary">은파호 · 2027년 9월 18일. 탑승 412명 · 생존 226명 · 사망·실종 186명. 모든 인물과 사건은 허구입니다.</p>
  <section><h3>인물 관계</h3><ul id="relations" class="dossier-list"></ul></section>
  <section><h3>확보한 증거</h3><ul id="evidenceList" class="dossier-list"></ul></section>
  <section><h3>선택의 여파</h3><ol id="decisionLog" class="dossier-list"></ol></section>
  <section><h3>내가 지나온 경로</h3><div id="trail" class="trail"></div></section>
  <section><h3>현재 상태</h3><div id="stats" class="statline"></div></section>
  <div class="drawer-actions">
   <button id="exportSave" type="button">기록 내보내기</button>
   <button id="importSave" type="button">기록 불러오기</button>
   <button id="restart" type="button">처음부터</button>
  </div>
  <input type="file" accept=".json,application/json" id="importFile" hidden>
  <a class="legacy-link" href="../">기존 79장면 버전으로 이동</a>
 </div>
</div>
</body>
</html>
